<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-labelledby="fitcheck-lockup-title">
  <title id="fitcheck-lockup-title">FITCHECK — the face decides what you wear</title>

  <!--
    FITCHECK — horizontal lockup, for README headers and social cards.

    NOTE: the wordmark is live text, not outlines, so this file needs Archivo
    available to render as designed (the site loads it; GitHub and most
    rasterisers will fall back). That is the right trade for this artifact —
    outlining eight letters by hand invites drift from the app's actual type,
    and the places this file is used are places where the webfont is present.

    Where a guaranteed-identical wordmark matters, set it as real HTML text in
    Archivo 900 beside logo-mark.svg instead. That is what the site header does:
    selectable, accessible, and it scales without a second asset.
  -->

  <g transform="translate(24 18) scale(0.5)">
    <g transform="rotate(-8 256 256)">
      <path id="lockup-tag-shadow"
        d="M 242 104 L 402 104 A 34 34 0 0 1 436 138 L 436 454 A 34 34 0 0 1 402 488
           L 178 488 A 34 34 0 0 1 144 454 L 144 218 Z" fill="#000000" />
      <path
        d="M 208 64 L 368 64 A 34 34 0 0 1 402 98 L 402 414 A 34 34 0 0 1 368 448
           L 144 448 A 34 34 0 0 1 110 414 L 110 178 Z"
        fill="#EBD22F" stroke="#000000" stroke-width="22" stroke-linejoin="round" />
      <circle cx="168" cy="136" r="25" fill="#FFFFFF" stroke="#000000" stroke-width="18" />
      <g stroke="#000000" stroke-width="19">
        <circle cx="212" cy="272" r="47" fill="#FFFFFF" />
        <circle cx="330" cy="272" r="47" fill="#FFFFFF" />
      </g>
      <circle cx="221" cy="287" r="21" fill="#000000" />
      <circle cx="339" cy="287" r="21" fill="#000000" />
    </g>
  </g>

  <text x="316" y="176"
    font-family="Archivo, 'Archivo Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900" font-size="132" letter-spacing="-4" fill="#000000">FITCHECK</text>

  <text x="320" y="238"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="600" font-size="34" letter-spacing="2.4" fill="#000000" opacity="0.72">THE FACE DECIDES WHAT YOU WEAR</text>
</svg>
